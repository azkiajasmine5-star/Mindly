version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: studywithkia_postgres
    restart: always
    environment:
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: study_password_2026
      POSTGRES_DB: studywithkia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: studywithkia_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studywithkia_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://study_user:study_password_2026@db:5432/studywithkia?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=studywithkia-super-secret-key-2026
      - PORT=5000
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studywithkia_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
